plugins {
    id "com.android.application"
    id 'com.google.gms.google-services' // Esto ya está bien
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // IMPORTANTE: El namespace debe coincidir con tu applicationId
    namespace "com.segadi.app" 
    compileSdkVersion 34 // Mantener en 34 es más estable para producción actualmente
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.segadi.app"
        minSdkVersion 26 // Correcto para soportar canales de notificación (Android 8.0+)
        targetSdkVersion 35 // Recomendado 34 para evitar problemas con permisos de fotos/media en 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // Descomenta esto si al compilar te da un error de "dex"
        multiDexEnabled true 
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false // Cámbialo a true solo cuando vayas a subir a producción
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Si minSdkVersion es 21 o mayor, no necesitas multidex:1.0.3 obligatoriamente,
    // pero dejarlo no hace daño.
    implementation "androidx.multidex:multidex:2.0.1" 
}